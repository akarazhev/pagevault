<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PageVault</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup-body">
    <header class="popup-header">
      <a class="brand" href="archive.html" target="_blank"
        ><span class="brand-mark" aria-hidden="true">P</span>PageVault</a
      ><span class="local-label">Local archive</span>
    </header>
    <main class="popup-main">
      <div id="message" class="notice" role="status" hidden></div>
      <section class="current-site">
        <p class="eyebrow">Current site</p>
        <h1 id="site-name">Loading…</h1>
        <p id="site-url" class="muted break-text"></p>
        <div class="site-toggle-row">
          <span id="site-state">Checking permission</span
          ><button id="toggle-site" class="button small" disabled>Enable recording</button>
        </div>
        <p id="site-help" class="help">Automatically saves loaded text and page changes.</p>
      </section>
      <button id="capture-now" class="button primary full-width" disabled>Save page now</button>
      <p id="capture-help" class="help">Capture the currently available page content once.</p>
      <section class="connection-section">
        <div class="status-heading">
          <span id="host-dot" class="status-dot"></span
          ><strong id="host-status">Checking connection…</strong>
        </div>
        <p id="last-saved" class="help"></p>
        <p id="host-error" class="help error-text" hidden></p>
        <a id="setup-link" class="text-link" href="options.html#installation" target="_blank" hidden
          >How to connect the helper →</a
        >
        <div class="queue-row">
          <div>
            <strong id="queue-count">—</strong><span class="muted"> queued</span>
            <div id="queue-size" class="help"></div>
          </div>
          <button id="retry-queue" class="button ghost small">Retry</button>
        </div>
      </section>
    </main>
    <footer class="popup-footer">
      <a href="archive.html" target="_blank">Open archive <span aria-hidden="true">↗</span></a
      ><a href="options.html" target="_blank">Settings</a>
    </footer>
  </body>
</html>
