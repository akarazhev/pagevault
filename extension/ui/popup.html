<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageVault</title><link rel="stylesheet" href="styles.css"><script type="module" src="popup.js"></script></head>
<body class="popup-body"><header class="popup-header"><a class="brand" href="archive.html" target="_blank"><span class="brand-mark" aria-hidden="true">P</span>PageVault</a><span class="local-label">Локальный архив</span></header>
<main class="popup-main"><div id="message" class="notice" role="status" hidden></div>
<section class="current-site"><p class="eyebrow">Текущий сайт</p><h1 id="site-name">Загрузка…</h1><p id="site-url" class="muted break-text"></p><div class="site-toggle-row"><span id="site-state">Проверяем разрешение</span><button id="toggle-site" class="button small" disabled>Разрешить запись</button></div><p id="site-help" class="help">Автоматически сохраняет уже загруженный текст и изменения страницы.</p></section>
<button id="capture-now" class="button primary full-width" disabled>Сохранить страницу сейчас</button><p id="capture-help" class="help">Разовый снимок доступного содержимого страницы.</p>
<section class="connection-section"><div class="status-heading"><span id="host-dot" class="status-dot"></span><strong id="host-status">Проверяем подключение…</strong></div><p id="last-saved" class="help"></p><p id="host-error" class="help error-text" hidden></p><a id="setup-link" class="text-link" href="options.html#installation" target="_blank" hidden>Как подключить помощника →</a><div class="queue-row"><div><strong id="queue-count">—</strong><span class="muted"> в очереди</span><div id="queue-size" class="help"></div></div><button id="retry-queue" class="button ghost small">Повторить</button></div></section>
</main><footer class="popup-footer"><a href="archive.html" target="_blank">Открыть архив <span aria-hidden="true">↗</span></a><a href="options.html" target="_blank">Настройки</a></footer></body></html>
