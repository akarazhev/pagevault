name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - run: go test ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...
        if: runner.os == 'Linux'
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - name: Validate PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/install-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Exercise Windows installer dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'pagevault-profile'
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          New-Item -ItemType Directory -Force bin/windows-amd64 | Out-Null
          go build -o bin/windows-amd64/pagevault-host.exe ./cmd/pagevault
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install-windows.ps1 -DryRun -Db (Join-Path $env:USERPROFILE 'archive.sqlite3')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/pagevault-host" ./cmd/pagevault
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm audit
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./cmd/... ./internal/...
